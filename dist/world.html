<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Slop World</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#a8bac0;color:white;font-family:'Helvetica Neue',Arial,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100svh;touch-action:none;outline:none}.hud{position:fixed;left:24px;right:24px;top:22px;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}.hud>*{pointer-events:auto}button{border:1px solid #ffffff77;color:#222;background:#ffffffdf;border-radius:30px;padding:12px 20px;font:inherit;cursor:pointer;backdrop-filter:blur(18px)}#label{font-size:14px;text-shadow:0 1px 8px #0008}#help{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:30px;background:#17232d88;backdrop-filter:blur(12px);font-size:12px;white-space:nowrap;pointer-events:none}#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#f8f7f3;color:#b6201b;z-index:2;font-size:20px}#loading[hidden]{display:none}#loading p{font-size:14px;color:#666}#loading button{margin-top:12px}.pad{position:fixed;bottom:80px;left:20px;display:grid;grid-template-columns:repeat(3,48px);gap:6px}.pad button{padding:12px;touch-action:none}.pad button:first-child{grid-column:2}.pad button:nth-child(2){grid-column:1}@media(pointer:fine){.pad{display:none}}@media(max-width:650px){#help{white-space:normal;width:85%;text-align:center;font-size:11px}.hud{left:16px;right:16px}#label{max-width:45%}}
</style><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body>
