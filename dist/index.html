<body class="page-loading">

    </svg>
    <div id="meadow-hints"><span id="grass-tap-hint" hidden>[Tap me]</span><span id="sky-tap-hint" hidden>[Tap me]</span></div>

    <p id="model-status" role="status">Loading collectible…</p>
    <p id="scroll-hint" role="status">Paint me</p>
